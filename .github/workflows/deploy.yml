name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need previous commit to detect changed files

      # Detect whether Dockerfile or theme changed — if yes, EC2 must rebuild
      - name: Check if image rebuild is needed
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(Dockerfile|theme/)'; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "Dockerfile or theme changed — full rebuild needed"
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "No Dockerfile/theme changes — fast restart only"
          fi

      - name: Deploy to EC2 — fast restart (no rebuild)
        if: steps.changes.outputs.rebuild == 'false'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -e
            cd /home/ec2-user/my-php-website

            echo "=== Syncing code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Restarting containers (no rebuild) ==="
            sudo docker compose up -d --remove-orphans

            echo "=== Verifying site is up ==="
            sleep 5
            curl -sf http://localhost/wp-login.php -o /dev/null \
              && echo "Site is responding ✅" \
              || echo "Warning: site did not respond"

            echo "=== Container status ==="
            sudo docker compose ps

            echo "=== Done ==="

      - name: Deploy to EC2 — full rebuild (Dockerfile or theme changed)
        if: steps.changes.outputs.rebuild == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/ec2-user/my-php-website

            echo "=== Syncing code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Rebuilding image (Dockerfile or theme changed) ==="
            sudo docker compose build --no-cache wordpress

            echo "=== Restarting containers ==="
            sudo docker compose up -d --remove-orphans

            echo "=== Verifying site is up ==="
            sleep 10
            curl -sf http://localhost/wp-login.php -o /dev/null \
              && echo "Site is responding ✅" \
              || echo "Warning: site did not respond"

            echo "=== Container status ==="
            sudo docker compose ps

            echo "=== Done ==="
