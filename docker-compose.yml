services:

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: leadgen_wp
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwpuser", "-pwppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    build:
      context: ./habitat-leadgen
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:80"
    env_file:
      - .env.local          # local environment variables
    environment:
      WP_ENV: local
      WORDPRESS_DB_HOST: db:3306
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wp_data:/var/www/html
      - ./habitat-leadgen:/var/www/html/wp-content/themes/habitat-leadgen

volumes:
  db_data:
  wp_data:
