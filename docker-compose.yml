
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: leadgen_wp
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwpuser", "-pwppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
    env_file:
      - .env.local
    environment:
      WP_ENV: local
      WORDPRESS_DB_HOST: db:3306
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wp_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/habitat-leadgen

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - wordpress

volumes:
  db_data:
  wp_data:
  caddy_data:
  caddy_config:

